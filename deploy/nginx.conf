# Not tested with nginx -t. Run it before reloading.
#
# Include inside the existing server { } block for edgecoursebd.com.
# Copy deploy/nginx-security-headers.conf next to your nginx configs and fix the include path.
# The folder is static files only: nginx serves it directly and never passes it to PHP.
# If the main site is Laravel, put the folder at public/admission26/ so the web root
# serves it as plain files. The page then has no access to the app, sessions or database.
#
# Use "alias" with a trailing slash, and set the real path. If your mime.types lacks
# webp or woff2, add the types block below inside the location.

# Deny everything except index.html and assets/. Regex locations beat the plain prefix
# below, so this also catches dotfiles, _source/, deploy/, scripts/, README and
# leftovers such as .crdownload files.
location ~ ^/admission26/(?!(index\.html$|assets/|$)) { return 404; }

location /admission26/ {
    alias /var/www/edgecoursebd.com/public/admission26/;
    index index.html;

    types { font/woff2 woff2; image/webp webp; }

    include /etc/nginx/snippets/nginx-security-headers.conf;
    # html, js, css: no hashed names, so revalidate every time (304 via ETag/Last-Modified).
    # This stops a returning visitor loading a mix of old and new ES modules after a deploy.
    add_header Cache-Control "no-cache" always;
}

# Images and fonts: new file = new name, so a year is safe.
# Cache-Control is set here once (no "expires", which would add a second header).
location ^~ /admission26/assets/img/ {
    alias /var/www/edgecoursebd.com/public/admission26/assets/img/;
    include /etc/nginx/snippets/nginx-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /admission26/assets/fonts/ {
    alias /var/www/edgecoursebd.com/public/admission26/assets/fonts/;
    types { font/woff2 woff2; }
    include /etc/nginx/snippets/nginx-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
